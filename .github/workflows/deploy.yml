name: Deploy to Live Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Identify Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            package:
              - 'package-lock.json'
            prisma:
              - 'prisma/schema.prisma'
            src:
              - 'src/**'
              - 'public/**'
              - 'next.config.ts'
              - 'next.config.js'
              - 'package.json'
              - '.github/workflows/deploy.yml'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Copy .env from production
        run: |
          if [ -f "/www/wwwroot/newppdb/.env" ]; then
            cp /www/wwwroot/newppdb/.env .
          fi

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Changes
        run: npx prisma db push --accept-data-loss

      - name: Build Application
        if: steps.filter.outputs.src == 'true'
        run: npm run build

      - name: Deploy to Production
        if: steps.filter.outputs.src == 'true'
        run: |
          # Sync standalone (quiet, fast)
          sudo /usr/bin/rsync -rltz --inplace --chown=www:www .next/standalone/ /www/wwwroot/newppdb/
          
          # Sync static assets
          sudo /usr/bin/mkdir -p /www/wwwroot/newppdb/.next/static
          sudo /usr/bin/rsync -rltz --inplace --delete --chown=www:www .next/static/ /www/wwwroot/newppdb/.next/static/
          
          # Sync public (exclude uploads)
          sudo /usr/bin/rsync -rltz --inplace --delete --exclude 'uploads' --chown=www:www public/ /www/wwwroot/newppdb/public/

      - name: Restart Application
        if: steps.filter.outputs.src == 'true'
        run: |
          cd /www/wwwroot/newppdb
          pm2 restart newppdb || pm2 start server.js --name "newppdb"
